name: sensorgrid_mobile
description: "SensorGrid: the field officer app for the soil monitoring system."
publish_to: 'none' # this app is not published to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: 6.1.5+1          # shares the signed-in person and the services with every screen
  intl: 0.20.3               # date and number formatting
  google_fonts: 8.2.1        # the Inter font of the design
  firebase_core: 5.0.0       # connects the app to the Firebase project
  firebase_auth: 7.0.0       # sign in with email and password
  firebase_database: 13.0.0  # the Realtime Database shared with the web console

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true